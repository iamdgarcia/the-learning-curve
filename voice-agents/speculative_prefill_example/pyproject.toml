[project]
name = "speculative-prefill-example"
version = "0.1.0"
description = "Speculative KV-cache prefill demo — ElevenLabs STT/TTS + local LLM"
requires-python = ">=3.10"

dependencies = [
    # Core pipecat + ElevenLabs + WebRTC runner
    "pipecat-ai[elevenlabs,silero,runner,webrtc]>=1.6.0,<2",
    # Speculative prefill library + the local Transformers backend
    "pipecat-speculative-prefill[transformers] @ git+https://github.com/iamdgarcia/pipecat-speculative-prefill.git",
    "python-dotenv",
]

[tool.uv]
package = false
