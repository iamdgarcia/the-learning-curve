<main class="pt-20 pb-16 px-4 md:px-8 max-w-3xl mx-auto">

<script>
const QUESTIONS = [
  {
    lesson: "1.1 — Cómo piensan los LLMs",
    q: "Tu pipeline de extracción de datos produce a veces resultados correctos y a veces incorrectos para el mismo input. No has cambiado nada en el código. ¿Cuál es la causa más probable?",
    options: [
      "Un bug en el parsing del output",
      "El LLM samplea de una distribución de probabilidad en cada ejecución, por lo que el output varía aunque el input sea igual",
      "El modelo fue actualizado sin avisar por el proveedor",
      "La temperatura está en 0 y eso genera variabilidad aleatoria"
    ],
    correct: 1,
    explanation: "Los LLMs generan tokens muestreando de una distribución de probabilidad. Con temperatura > 0, el output varía entre ejecuciones aunque el input sea idéntico. La solución es fijar temperatura a 0 para tareas que requieren reproducibilidad."
  },
  {
    lesson: "1.2 — Tokens y context window",
    q: "Tu chatbot de soporte acumula historial de conversación. Después de ~40 turnos, el modelo empieza a ignorar las instrucciones del system prompt. ¿Cuál es la causa y la solución correcta?",
    options: [
      "El modelo tiene un bug de memoria interna que acumula estado",
      "Deberías usar un modelo con más parámetros para mayor retención",
      "El historial está llenando la context window y desplaza el system prompt fuera del contexto activo; hay que summarizar o truncar el historial",
      "El system prompt es demasiado largo y compite con el historial"
    ],
    correct: 2,
    explanation: "La context window es finita. Cuando el historial crece, desplaza otras partes del contexto. La solución arquitectónica es summarización del historial o sliding window que preserve siempre el system prompt en posición inicial."
  },
  {
    lesson: "1.3 — Embeddings para arquitectos",
    q: "Tienes 50.000 artículos técnicos. Los usuarios buscan conceptos como "cómo configurar autenticación OAuth". ¿Qué técnica de búsqueda eliges?",
    options: [
      "Búsqueda por keywords exactas (LIKE en SQL)",
      "Embedding de la query + similitud coseno en un vector DB",
      "Full-text search con BM25 sobre el texto completo",
      "Filtrado por categoría de metadatos predefinida"
    ],
    correct: 1,
    explanation: "Los embeddings capturan significado semántico: 'configurar OAuth' y 'implementar autenticación' pueden tener embeddings similares aunque no compartan palabras. BM25 es mejor que keywords pero no razona sobre sinónimos ni conceptos."
  },
  {
    lesson: "1.4 — Temperatura y determinismo",
    q: "Estás construyendo un sistema que extrae campos estructurados (nombre, fecha, importe) de facturas PDF. ¿Qué temperatura configuras para el LLM?",
    options: [
      "0.7 — la default de la mayoría de APIs, equilibrio seguro",
      "1.0 — para que el modelo explore diferentes formatos de extracción",
      "0 — hay una respuesta correcta objetiva, queremos siempre la misma",
      "0.3 — un poco de variabilidad mejora la robustez ante formatos distintos"
    ],
    correct: 2,
    explanation: "Temperatura 0 hace al LLM elegir siempre el token más probable. Para extracción de datos existe una respuesta correcta objetiva; cualquier variabilidad es un error potencial. Guardar la variabilidad para tareas creativas, nunca para extracción."
  },
  {
    lesson: "1.5 — Fine-tuning vs RAG",
    q: "Tu empresa actualiza sus políticas internas cada semana. Quieres que el chatbot interno responda siempre según las políticas más recientes. ¿Qué arquitectura eliges?",
    options: [
      "Fine-tuning del modelo base en cada ciclo de actualización semanal",
      "RAG con las políticas indexadas en un vector DB, actualizado continuamente",
      "Incluir todas las políticas en el system prompt de cada request",
      "Fine-tuning inicial + actualizar el system prompt con los cambios recientes"
    ],
    correct: 1,
    explanation: "RAG separa el conocimiento del modelo: actualizar el vector DB es inmediato y barato. Fine-tuning es costoso, lento, y fija el conocimiento en el momento de entrenamiento. El system prompt no escala con volumen de políticas."
  },
  {
    lesson: "1.6 — Prompt engineering para arquitectos",
    q: "El LLM de tu pipeline produce outputs inconsistentes: a veces devuelve JSON, a veces texto libre, a veces mezcla ambos. ¿Cuál es el problema más probable?",
    options: [
      "El modelo no es lo suficientemente potente para la tarea",
      "El formato de output no está especificado o es ambiguo en el prompt",
      "La temperatura está demasiado baja y limita las opciones de formato",
      "El system prompt es demasiado corto para establecer comportamiento"
    ],
    correct: 1,
    explanation: "Sin especificación clara del formato de salida, el LLM elige el que parece más probable dado el contexto. Especificar el schema JSON exacto en el prompt —o usar structured outputs con validación de schema— elimina la ambigüedad completamente."
  },
  {
    lesson: "1.7 — El coste real de un LLM en producción",
    q: "Tu pipeline LLM cuesta 10× más de lo esperado. Los logs muestran que el 70% del coste viene de tokens de OUTPUT, no de input. ¿Cuál es la intervención más efectiva?",
    options: [
      "Cambiar a un modelo más barato por request",
      "Reducir el tamaño del system prompt para bajar el coste de input",
      "Añadir una instrucción que limita la longitud del output y evaluar si la calidad se mantiene",
      "Implementar caching semántico del input para reducir llamadas"
    ],
    correct: 2,
    explanation: "El problema es output tokens excesivos —el LLM genera más texto del necesario. Limitar la longitud del output es la intervención de mayor ROI. Cambiar de modelo reduce el coste por token pero no ataca la causa raíz de la verbosidad."
  }
];

let score = 0;
let answered = new Array(QUESTIONS.length).fill(false);

function render() {
  const container = document.getElementById('questions-container');
  container.innerHTML = '';

  QUESTIONS.forEach((q, qi) => {
    const card = document.createElement('div');
    card.className = 'bg-surface-container-lowest rounded-2xl border border-surface-container-high shadow-sm p-6';
    card.id = 'card-' + qi;

    const lessonBadge = `<span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full bg-surface-container text-on-surface-variant text-[11px] font-bold uppercase tracking-wider mb-3">
      <span class="material-symbols-outlined text-[13px]">school</span>${q.lesson}</span>`;

    const qNum = `<span class="text-[11px] font-bold text-on-surface-variant uppercase tracking-wider">Pregunta ${qi + 1} de ${QUESTIONS.length}</span>`;

    const qText = `<p class="text-[15px] font-semibold text-on-surface leading-snug mt-2 mb-4">${q.q}</p>`;

    const optionsHtml = q.options.map((opt, oi) => {
      const letter = ['A', 'B', 'C', 'D'][oi];
      return `<button
        id="opt-${qi}-${oi}"
        onclick="answer(${qi}, ${oi})"
        class="opt-btn opt-neutral w-full text-left flex items-start gap-3 px-4 py-3 rounded-xl border border-surface-container-high bg-surface-container-low text-[14px] text-on-surface font-medium mb-2 last:mb-0"
      >
        <span class="shrink-0 w-6 h-6 rounded-full bg-surface-container flex items-center justify-center text-[11px] font-bold text-on-surface-variant mt-0.5">${letter}</span>
        <span class="leading-snug">${opt}</span>
      </button>`;
    }).join('');

    const explanationHtml = `<div class="explanation mt-4 items-start gap-2 p-3 rounded-xl bg-primary-fixed" id="exp-${qi}">
      <span class="material-symbols-outlined text-primary-container text-[20px] shrink-0 mt-0.5">lightbulb</span>
      <p class="text-[13px] text-on-surface leading-relaxed">${q.explanation}</p>
    </div>`;

    card.innerHTML = `
      <div class="flex items-start justify-between gap-2 mb-1">
        ${lessonBadge}
        ${qNum}
      </div>
      ${qText}
      <div id="opts-${qi}">${optionsHtml}</div>
      ${explanationHtml}
    `;

    container.appendChild(card);
  });
}

function answer(qi, chosen) {
  if (answered[qi]) return;
  answered[qi] = true;

  const q = QUESTIONS[qi];
  const isCorrect = chosen === q.correct;
  if (isCorrect) score++;

  // Style all options
  for (let oi = 0; oi < 4; oi++) {
    const btn = document.getElementById('opt-' + qi + '-' + oi);
    btn.disabled = true;
    btn.classList.remove('opt-neutral');
    if (oi === q.correct) {
      btn.classList.add('opt-correct');
    } else {
      btn.classList.add('opt-wrong');
    }
  }

  // Show explanation
  const exp = document.getElementById('exp-' + qi);
  exp.classList.add('visible');

  // Update score
  document.getElementById('score-current').textContent = score;

  // Update progress bar
  const done = answered.filter(Boolean).length;
  document.getElementById('progress-bar').style.width = (done / QUESTIONS.length * 100) + '%';

  // Check if all answered
  if (done === QUESTIONS.length) {
    setTimeout(showFinish, 600);
  }
}

function showFinish() {
  const banner = document.getElementById('finish-banner');
  const scoreEl = document.getElementById('finish-score');
  const msgEl = document.getElementById('finish-msg');

  scoreEl.textContent = score + ' / ' + QUESTIONS.length;

  let msg = '';
  const pct = score / QUESTIONS.length;
  if (pct === 1)        msg = 'Perfecto. Dominas las decisiones de diseño de fundamentos.';
  else if (pct >= 0.71) msg = 'Sólido. Revisa las respuestas incorrectas — son las decisiones que más cuestan en producción.';
  else if (pct >= 0.43) msg = 'A medias. Vuelve a las lecciones de las preguntas falladas antes de continuar al S2.';
  else                   msg = 'Vuelve al semestre 1. Estos fundamentos son la base de todo lo que sigue.';

  msgEl.textContent = msg;
  banner.classList.add('visible');
  banner.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function resetQuiz() {
  score = 0;
  answered = new Array(QUESTIONS.length).fill(false);
  document.getElementById('score-current').textContent = '0';
  document.getElementById('progress-bar').style.width = '0%';
  document.getElementById('finish-banner').classList.remove('visible');
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

render();
</script>
</body>
